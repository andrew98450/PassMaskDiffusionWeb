openapi: 3.1.0

info:
  title: Diffusion Sample API
  version: 1.0.0
  description: Generate candidate samples from mask text.

paths:
  /sample:
    get:
      operationId: getSamples
      summary: Generate samples
      description: Generate N samples based on mask_text.

      parameters:
        - name: mask_text
          in: query
          required: true
          description: Input mask text.
          schema:
            type: string

        - name: N
          in: query
          required: false
          description: Number of samples to generate.
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: string

              example:
                data:
                  - test123
                  - test456
                  - test789

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

              example:
                error: Invalid parameter